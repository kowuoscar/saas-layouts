name: build
description: Multi-topic CI workflow - detects changes and builds affected topics only

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  packages: write
  contents: read

jobs:
  detect:
    name: Detect changed topics
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has-changes: ${{ steps.set-matrix.outputs.has-changes }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            exercises/*/solution/**

      - name: Parse topics from changed files
        id: set-matrix
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          # Extract unique topic numbers from changed files
          # e.g., exercises/topic-01/solution/... -> topic-01
          TOPICS=$(echo "$CHANGED_FILES" | grep -oP 'exercises/\Ktopic-\d+' | sort -u)

          if [ -z "$TOPICS" ]; then
            echo "has-changes=false" >> $GITHUB_OUTPUT
            echo "matrix={\"include\":[]}" >> $GITHUB_OUTPUT
          else
            echo "has-changes=true" >> $GITHUB_OUTPUT
            MATRIX=$(echo "$TOPICS" | jq -R -s -c 'split("\n")[:-1] | map({topic: .})')
            echo "matrix={\"include\":$MATRIX}" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build ${{ matrix.topic }}
    needs: detect
    if: needs.detect.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push topic
        uses: docker/build-push-action@v7
        with:
          context: ./exercises/${{ matrix.topic }}/solution
          push: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.topic }}:${{ github.sha }}

  summary:
    name: Build summary
    needs: detect
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report status
        run: |
          if [ "${{ needs.detect.outputs.has-changes }}" == "true" ]; then
            echo "✓ Built topics from matrix: ${{ needs.detect.outputs.matrix }}"
          else
            echo "⊘ No changes detected in exercises/*/solution/** folders - skipping builds"
          fi
